<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<style>

body{
margin:0;
font-family:Arial;
text-align:center;
background:linear-gradient(120deg,#ff9a9e,#fad0c4);
color:white;
overflow:hidden;
}

#entry,#balloonGame,#birthdayPage,#gamesMenu{
display:none;
padding:30px;
}

#entry.active,
#balloonGame.active,
#birthdayPage.active,
#gamesMenu.active{
display:block;
}

input{
padding:10px;
font-size:18px;
border-radius:8px;
border:none;
}

button{
padding:10px 20px;
margin:10px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:#ff4d6d;
color:white;
}

button:hover{
background:#ff1e4d;
}

.photo{
width:220px;
border-radius:20px;
margin-top:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

/* BALLOON STYLE */

.balloon{
position:absolute;
width:60px;
height:80px;
border-radius:50%;
cursor:pointer;
animation:floatUp linear infinite;
}

/* balloon string */
.balloon::after{
content:"";
position:absolute;
width:2px;
height:40px;
background:white;
left:50%;
top:80px;
}

/* floating animation */

@keyframes floatUp{
0%{
transform:translateY(100vh);
}
100%{
transform:translateY(-120px);
}
}

</style>
</head>

<body>

<!-- PIN PAGE -->

<div id="entry" class="active">

<h1>Enter PIN </h1>

<input type="password" id="pinInput">

<br><br>

<button onclick="checkPin()">Unlock</button>

<p id="hintText"></p>

</div>


<!-- BALLOON GAME -->

<div id="balloonGame">

<h1> Pop All Balloons!</h1>
<p id="balloonCount"></p>

</div>


<!-- BIRTHDAY PAGE -->

<div id="birthdayPage">

<h1>Happy Birthday </h1>

<img src="birthday.jpg" class="photo">

<p>Wishing you a day full of love and happiness </p>

<br>

<button onclick="openGames()">Play Mini Games </button>

</div>


<!-- MINI GAMES MENU -->

<div id="gamesMenu">

<h1> Mini Games</h1>

<button onclick="guessGame()">Number Guess</button>
<button onclick="reactionGame()">Reaction Test</button>
<button onclick="loveMeter()">Love Meter</button>

<p id="gameResult"></p>

</div>


<script>

let balloonsLeft=6;
let wrongAttempts=0;

/* PIN CHECK */

function checkPin(){

let pin=document.getElementById("pinInput").value;

if(pin==="1603"){

document.getElementById("entry").classList.remove("active");
document.getElementById("balloonGame").classList.add("active");

startBalloonGame();

}else{

wrongAttempts++;

if(wrongAttempts>=3){
document.getElementById("hintText").innerText="Hint: Birthday date (DDMM)";
}else{
document.getElementById("hintText").innerText="Wrong PIN";
}

}

}


/* BALLOON GAME */

function startBalloonGame(){

document.getElementById("balloonCount").innerText="Balloons left: "+balloonsLeft;

for(let i=0;i<balloonsLeft;i++){

createBalloon();

}

}


function createBalloon(){

let balloon=document.createElement("div");

balloon.className="balloon";

balloon.style.background=randomColor();

balloon.style.left=Math.random()*window.innerWidth+"px";

balloon.style.animationDuration=(4+Math.random()*4)+"s";

balloon.onclick=function(){

balloon.remove();

balloonsLeft--;

document.getElementById("balloonCount").innerText="Balloons left: "+balloonsLeft;

if(balloonsLeft===0){

showBirthday();

}

};

document.body.appendChild(balloon);

}


/* BIRTHDAY PAGE */

function showBirthday(){

document.getElementById("balloonGame").classList.remove("active");
document.getElementById("birthdayPage").classList.add("active");

}


/* MINI GAMES MENU */

function openGames(){

document.getElementById("birthdayPage").classList.remove("active");
document.getElementById("gamesMenu").classList.add("active");

}


/* MINI GAME 1 */

function guessGame(){

let num=Math.floor(Math.random()*10)+1;

let guess=prompt("Guess number 1-10");

if(guess==num){

document.getElementById("gameResult").innerText=" Correct!";

}else{

document.getElementById("gameResult").innerText=" Number was "+num;

}

}


/* MINI GAME 2 */

function reactionGame(){

alert("Click OK fast!");

let start=Date.now();

alert("CLICK!");

let end=Date.now();

let time=(end-start)/1000;

document.getElementById("gameResult").innerText="Reaction: "+time+" sec";

}


/* MINI GAME 3 */

function loveMeter(){

let love=Math.floor(Math.random()*100);

document.getElementById("gameResult").innerText="Love Meter "+love+"%";

}


/* RANDOM COLORS */

function randomColor(){

let colors=["#ff6b81","#1e90ff","#34d399","#fcd34d","#a78bfa"];

return colors[Math.floor(Math.random()*colors.length)];

}

</script>

</body>
</html>
